[project]
name = "cv-fp-mining-lab"
version = "0.1.0"
description = "False-positive clustering and hard-negative mining lab for computer vision systems"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "hdbscan>=0.8.33",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "scikit-learn>=1.3",
    "umap-learn>=0.5.5",
    "wandb>=0.17",
]

[project.optional-dependencies]
clip = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
