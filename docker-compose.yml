services:
  miner:
    build:
      context: .
      dockerfile: Dockerfile
    image: cv-fp-mining-lab:latest
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
      WANDB_MODE: ${WANDB_MODE:-offline}
      WANDB_PROJECT: ${WANDB_PROJECT:-cv-fp-mining-lab}
      # Point the W&B client at the self-hosted server (in-cluster DNS name).
      WANDB_BASE_URL: ${WANDB_BASE_URL:-http://wandb:8080}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-cv-fp-mining}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./wandb:/app/wandb
    depends_on:
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ml-backend:
    image: cv-fp-mining-lab:latest
    working_dir: /app
    command: python services/ml_backend.py
    environment:
      PYTHONPATH: /app/src
    ports:
      - "${ML_BACKEND_PORT:-9090}:9090"
    volumes:
      - ./configs:/app/configs:ro
      - ./services:/app/services:ro
      - ./src:/app/src:ro
      - ./data:/app/data
    depends_on:
      - miner
    networks:
      default:
        # Dotted alias so Label Studio's URL validator accepts the address
        # (bare service names like "ml-backend" are rejected as invalid URLs).
        aliases:
          - ml-backend.local

  webhook:
    image: cv-fp-mining-lab:latest
    working_dir: /app
    command: python services/webhook.py
    environment:
      PYTHONPATH: /app/src
      # Retrains log to the self-hosted W&B (offline unless an API key is set).
      WANDB_MODE: ${WANDB_MODE:-offline}
      WANDB_PROJECT: ${WANDB_PROJECT:-cv-fp-mining-lab}
      WANDB_BASE_URL: ${WANDB_BASE_URL:-http://wandb:8080}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
    ports:
      - "${WEBHOOK_PORT:-9091}:9091"
    volumes:
      - ./configs:/app/configs:ro
      - ./services:/app/services:ro
      - ./src:/app/src:ro
      - ./data:/app/data
    depends_on:
      - miner
    networks:
      default:
        # Dotted alias so Label Studio's URL validator accepts the address.
        aliases:
          - webhook.local

  labelstudio:
    image: heartexlabs/label-studio:latest
    ports:
      - "${LABEL_STUDIO_PORT:-8080}:8080"
    environment:
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST:-http://localhost:8080}
      # Serve task images straight from the mounted data dir via
      # /data/local-files/?d=<path relative to the document root>.
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /cv-fp-mining-lab/data
    volumes:
      - labelstudio-data:/label-studio/data
      - ./data:/cv-fp-mining-lab/data:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data

  # Static image server — serves data/ over plain HTTP so the Label Studio UI can
  # render task images without the local-files auth dance. Browser fetches images
  # directly from here; the ML backend still reads files via image_local_path.
  fileserver:
    image: nginx:alpine
    ports:
      - "${FILESERVER_PORT:-18090}:80"
    volumes:
      - ./data:/usr/share/nginx/html:ro

  # Self-hosted Weights & Biases Server (single-container "local" image).
  # First run: open the UI, create a user, copy the API key into .env
  # (WANDB_API_KEY) and set WANDB_MODE=online to log to this instance.
  # Full features (teams, long retention) require a license from
  # https://deploy.wandb.ai — set WANDB_LICENSE.
  wandb:
    image: wandb/local:latest
    ports:
      - "${WANDB_PORT:-18082}:8080"
    environment:
      # Externally reachable URL so generated run/report links resolve.
      HOST: ${WANDB_HOST:-http://localhost:18082}
      LICENSE: ${WANDB_LICENSE:-}
    volumes:
      - wandb-server-data:/vol

volumes:
  labelstudio-data:
  minio-data:
  wandb-server-data:
