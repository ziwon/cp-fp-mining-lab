services:
  miner:
    build:
      context: .
      dockerfile: Dockerfile
    image: cv-fp-mining-lab:latest
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
      WANDB_MODE: ${WANDB_MODE:-offline}
      WANDB_PROJECT: ${WANDB_PROJECT:-cv-fp-mining-lab}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-cv-fp-mining}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./wandb:/app/wandb
    depends_on:
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  labelstudio:
    image: heartexlabs/label-studio:latest
    ports:
      - "${LABEL_STUDIO_PORT:-8080}:8080"
    environment:
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST:-http://localhost:8080}
    volumes:
      - labelstudio-data:/label-studio/data
      - ./data:/cv-fp-mining-lab/data:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data

volumes:
  labelstudio-data:
  minio-data:
