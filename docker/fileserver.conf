server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Label Studio loads task images with crossorigin="anonymous" (to allow
    # canvas drawing), so the browser requires CORS headers or it discards the
    # image as a violation even when the GET returns 200.
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri =404;
    }
}
