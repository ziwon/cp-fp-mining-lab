paths:
  raw_dir: data/raw
  processed_dir: data/processed
  labelstudio_export_dir: data/labelstudio_exports

sample_data:
  seed: 42
  image_size: 224
  samples_per_type: 24
  fp_types:
    - steam
    - fog
    - reflection
    - headlight
    - shadow
    - animal

embedding:
  method: simple
  output_file: data/processed/embeddings.npy
  metadata_file: data/processed/fp_events.csv

clustering:
  umap_neighbors: 10
  umap_min_dist: 0.05
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples: 3

active_learning:
  # null budget exports every task (default demo); set an int to send only the
  # top-N most informative tasks to review.
  budget: null
  strategy: entropy  # least_confidence | margin | entropy
  diversity: true    # round-robin across clusters so one cluster cannot dominate

detector:
  registry_dir: data/processed/model_registry
  metric_key: macro_f1
  # candidate must beat production by this margin to be promoted
  promotion_min_delta: 0.0

serving:
  # Label Studio ML backend (Phase 2)
  host: 0.0.0.0
  port: 9090
  model_alias: production

webhook:
  # retrain trigger receiver (Phase 3)
  host: 0.0.0.0
  port: 9091
  batch_threshold: 10

wandb:
  project: cv-fp-mining-lab
  entity: null
  artifact_name: curated-fp-samples
