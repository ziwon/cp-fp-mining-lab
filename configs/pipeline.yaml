paths:
  raw_dir: data/raw
  processed_dir: data/processed
  labelstudio_export_dir: data/labelstudio_exports

sample_data:
  seed: 42
  image_size: 224
  samples_per_type: 24
  fp_types:
    - steam
    - fog
    - reflection
    - headlight
    - shadow
    - animal

embedding:
  method: simple   # simple | clip (clip needs `uv sync --extra clip`)
  output_file: data/processed/embeddings.npy
  metadata_file: data/processed/fp_events.csv
  clip_model: openai/clip-vit-base-patch32
  device: null     # null = auto (cuda if available, else cpu)
  batch_size: 32

clustering:
  umap_neighbors: 10
  umap_min_dist: 0.05
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples: 3

active_learning:
  # null budget exports every task (default demo); set an int to send only the
  # top-N most informative tasks to review.
  budget: null
  strategy: entropy  # least_confidence | margin | entropy
  diversity: true    # round-robin across clusters so one cluster cannot dominate

dfire:
  # Real fire/smoke object-detection data (YOLO format).
  # Use dfire-300-stratified for a fast CPU smoke test; full D-Fire/train for real.
  root: /data/vrs/D-Fire
  train_dir: /data/vrs/D-Fire/train
  val_dir: /data/vrs/D-Fire/test
  data_yaml: data/processed/dfire.yaml
  classes:
    0: smoke
    1: fire

yolo:
  # Heavy artifacts live on /data (the workspace disk is small on this host).
  base_weights: /data/cpfp-output/yolov8n.pt
  epochs: 50
  imgsz: 640
  batch: 32
  device: cpu        # set to 0 for the first CUDA GPU (needs CUDA-enabled torch)
  runs_dir: /data/cpfp-output/yolo_runs
  run_name: dfire-full
  weights: /data/cpfp-output/yolo_runs/dfire-full/weights/best.pt

gate:
  # Detection-aware promotion gate on a frozen eval set. Deltas are tolerances:
  # negative allows a small regression, 0.0 is strict.
  registry_dir: /data/cpfp-output/detector_registry
  eval_split: val            # the data_yaml split to evaluate (D-Fire test)
  conf: 0.25
  iou: 0.5
  map50_min_delta: -0.01     # candidate mAP@50 must not drop more than this
  recall_min_delta: -0.02    # per-class recall floor vs production
  fp_rate_max_delta: 0.0     # negative-image FP-rate must not increase
  fp_eval_limit: 1500        # images scanned for the FP-rate metric (speed)

mining:
  # Harvest false positives by running the detector over a split.
  source_images: /data/vrs/D-Fire/test/images
  source_labels: /data/vrs/D-Fire/test/labels
  crops_dir: /data/cpfp-output/fp_crops
  conf: 0.25         # detection confidence floor
  iou_thr: 0.4       # below this IoU with a same-class GT box → false positive
  limit: null        # cap images scanned (null = all); set small for quick runs

labelstudio:
  # How task image references are emitted for the Label Studio UI.
  #   http:        absolute URL served by the fileserver container (reliable demo)
  #   local_files: LS local-files URLs (needs a registered Local Storage in LS)
  #   path:        raw local path (only renders if LS can read it directly)
  image_mode: http
  # Browser-reachable base for the fileserver (host-mapped FILESERVER_PORT).
  http_base_url: http://localhost:18090
  local_files_url_prefix: "/data/local-files/?d="
  # Stripped from the path; the remainder is appended to the base above.
  data_dir_strip: "data/"

detector:
  registry_dir: data/processed/model_registry
  metric_key: macro_f1
  # Promote when candidate_metric >= production_metric + promotion_min_delta.
  #   0.0   strict: candidate must at least match production
  #   >0    require a real improvement of that size
  #   <0    tolerance: accept a candidate within |delta| of production
  promotion_min_delta: 0.0

serving:
  # Label Studio ML backend (Phase 2)
  host: 0.0.0.0
  port: 9090
  model_alias: production

webhook:
  # retrain trigger receiver (Phase 3)
  host: 0.0.0.0
  port: 9091
  batch_threshold: 10

wandb:
  project: cv-fp-mining-lab
  entity: null
  artifact_name: curated-fp-samples
